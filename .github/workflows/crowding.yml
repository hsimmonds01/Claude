name: Northern line crowding log

# Trigger: an external cron-job.org job POSTs to the workflow_dispatch
# endpoint every 5 minutes during the commute hours. GitHub's native
# `schedule` was removed -- it ran late/skipped, and its extra runs collided
# with the other main-committing workflows on the git push (causing failure
# emails). cron-job.org is the sole, reliable trigger now.
#
# The script itself decides -- via zoneinfo Europe/London, which knows about
# DST -- whether "now" is inside a commute window (07:00-09:30 / 16:30-19:00,
# Mon-Fri) and no-ops otherwise, so extra pings are cheap and safe.
on:
  workflow_dispatch:
    inputs:
      mode:
        description: "Run mode"
        type: choice
        options:
          - live
          - status
        default: live
      force:
        description: "live mode: bypass the window gate and log now"
        type: boolean
        default: false

permissions:
  contents: write

# Serialise git-writing runs so concurrent pushes to main never race. This
# group is SHARED with the other workflows that commit to main (the
# dock-alerter) so GitHub queues them one after another instead of letting
# their pushes collide. Queue rather than cancel, so a delayed run still gets
# a chance to log (and so one workflow can't cancel another mid-run).
concurrency:
  group: main-git-writer
  cancel-in-progress: false

jobs:
  log:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        working-directory: crowding-tracker
        run: pip install -r requirements.txt

      - name: Poll crowding
        working-directory: crowding-tracker
        env:
          # Optional Unified API key. Prefer a secret over a variable so it is
          # masked in the (publicly visible) Actions logs.
          TFL_APP_KEY: ${{ secrets.TFL_APP_KEY }}
          MODE: ${{ inputs.mode || 'live' }}
          FORCE: ${{ inputs.force }}
        run: |
          ARGS="--mode ${MODE}"
          if [ "${FORCE}" = "true" ]; then
            ARGS="$ARGS --force"
          fi
          python check_crowding.py $ARGS

      - name: Commit new readings (if any)
        if: ${{ (inputs.mode || 'live') == 'live' }}
        run: |
          git add crowding-tracker/history.csv
          if git diff --cached --quiet; then
            echo "No new readings (outside window), nothing to commit."
          else
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"

            # Snapshot exactly the rows THIS run appended, so that if a rebase
            # hits a real content conflict (two runs appending to history.csv
            # within the same few seconds) we can replay just our rows on top
            # of the latest main rather than trying to patch a stale diff.
            NEW_ROWS=$(git diff --cached -- crowding-tracker/history.csv | grep '^+' | grep -v '^+++' | sed 's/^+//' || true)

            git commit -m "Log Northern line crowding readings"

            # main is shared with several other automations that also commit
            # and push on their own schedules. The shared concurrency group is
            # only best-effort, so a push can still be rejected as non-fast-
            # forward if one of them lands in the moment between our checkout
            # and our push. Retry a few times, rebasing this run's appended
            # rows onto the latest main each time rather than failing the run.
            for attempt in 1 2 3 4 5; do
              if git push; then
                break
              fi
              echo "Push rejected (attempt $attempt/5) -- fetching and retrying..."
              sleep $((attempt * 2))
              git fetch origin main
              if git rebase origin/main; then
                continue
              fi
              # A real content conflict (two runs appended in the same window),
              # not just a fast-forward race. Don't hand-resolve a stale diff:
              # drop this commit, reset onto the new tip, and re-append just
              # this run's own rows on top of whatever is there now.
              echo "Rebase hit a real conflict -- reapplying this run's rows on the latest main."
              git rebase --abort
              git reset --hard origin/main
              if [ -n "$NEW_ROWS" ]; then
                printf '%s\n' "$NEW_ROWS" >> crowding-tracker/history.csv
                git add crowding-tracker/history.csv
              fi
              if git diff --cached --quiet; then
                echo "Nothing left to add on top of the latest main -- another run already recorded this."
                break
              fi
              git commit -m "Log Northern line crowding readings"
            done
          fi
