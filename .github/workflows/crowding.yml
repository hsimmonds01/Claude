name: Northern line crowding log

# Trigger: an external cron-job.org job POSTs to the workflow_dispatch
# endpoint every 5 minutes during the commute hours. GitHub's native
# `schedule` was removed -- it ran late/skipped, and its extra runs collided
# with the other main-committing workflows on the git push (causing failure
# emails). cron-job.org is the sole, reliable trigger now.
#
# The script itself decides -- via zoneinfo Europe/London, which knows about
# DST -- whether "now" is inside a commute window (07:00-09:30 / 16:30-19:00,
# Mon-Fri) and no-ops otherwise, so extra pings are cheap and safe.
on:
  workflow_dispatch:
    inputs:
      mode:
        description: "Run mode"
        type: choice
        options:
          - live
          - status
        default: live
      force:
        description: "live mode: bypass the window gate and log now"
        type: boolean
        default: false

permissions:
  contents: write

# Serialise git-writing runs so concurrent pushes to main never race. This
# group is SHARED with the other workflows that commit to main (the
# dock-alerter) so GitHub queues them one after another instead of letting
# their pushes collide. Queue rather than cancel, so a delayed run still gets
# a chance to log (and so one workflow can't cancel another mid-run).
concurrency:
  group: main-git-writer
  cancel-in-progress: false

jobs:
  log:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        working-directory: crowding-tracker
        run: pip install -r requirements.txt

      - name: Poll crowding
        working-directory: crowding-tracker
        env:
          # Optional Unified API key. Prefer a secret over a variable so it is
          # masked in the (publicly visible) Actions logs.
          TFL_APP_KEY: ${{ secrets.TFL_APP_KEY }}
          MODE: ${{ inputs.mode || 'live' }}
          FORCE: ${{ inputs.force }}
        run: |
          ARGS="--mode ${MODE}"
          if [ "${FORCE}" = "true" ]; then
            ARGS="$ARGS --force"
          fi
          python check_crowding.py $ARGS

      - name: Commit new readings (if any)
        if: ${{ (inputs.mode || 'live') == 'live' }}
        run: |
          git add crowding-tracker/history.csv
          if ! git diff --cached --quiet; then
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git commit -m "Log Northern line crowding readings"
            git push
          else
            echo "No new readings (outside window), nothing to commit."
          fi
