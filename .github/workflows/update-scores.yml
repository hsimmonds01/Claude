name: Update World Cup standings

# World Cup 2026 finished -- scheduled polling paused to stop burning Actions
# minutes and API quota on a tournament that's over. Re-add the `schedule:`
# block below (same cron, or adjust) to reactivate for the next tournament.
# workflow_dispatch stays enabled so it can still be run manually if needed.
on:
  # schedule:
  #   - cron: "4,19,34,49 * * * *"
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: main-git-writer
  cancel-in-progress: false

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: "24"

      - name: Fetch latest match data
        env:
          FOOTBALL_DATA_API_KEY: ${{ secrets.FOOTBALL_DATA_API_KEY }}
        run: node scripts/fetch-scores.mjs

      - name: Commit updated standings if changed
        run: |
          if git diff --quiet -- data/standings.json; then
            echo "No changes to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/standings.json
          git commit -m "Update World Cup standings"
          git push
