<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>FPL Agent</title>
<style>
  :root{
    --pl-purple:#37003c; --pl-purple-2:#2b002f; --pl-green:#00ff87; --pl-cyan:#04f5ff;
    --pitch-1:#02753a; --pitch-2:#04a14f;
    --ink:#1a1a1a; --muted:#6b7280; --line:#e5e7eb; --bg:#f4f4f6; --card:#fff;
  }
  @media (prefers-color-scheme:dark){
    :root{ --ink:#f3f4f6; --muted:#9ca3af; --line:#374151; --bg:#14101a; --card:#1f1a26; }
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--ink);
       font-family:-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif}
  .wrap{max-width:900px;margin:0 auto;padding:0 0 40px}
  header{background:linear-gradient(135deg,var(--pl-purple),var(--pl-purple-2));color:#fff;padding:18px 16px}
  .title{font-size:20px;font-weight:800;letter-spacing:-.2px}
  .sub{font-size:12px;color:#c9b7d4;margin-top:3px}
  .stats{display:flex;gap:8px;margin-top:14px;flex-wrap:wrap}
  .stat{background:rgba(255,255,255,.1);border-radius:10px;padding:8px 12px;flex:1;min-width:88px}
  .stat b{display:block;font-size:17px;color:var(--pl-green)}
  .stat span{font-size:10px;text-transform:uppercase;letter-spacing:.5px;color:#c9b7d4}

  .tabs{display:flex;gap:6px;margin-top:14px}
  .tab{flex:1;background:rgba(255,255,255,.1);border:1px solid transparent;color:#e9d9ee;
       border-radius:8px;padding:8px 6px;font-size:12px;font-weight:700;cursor:pointer;
       font-family:inherit}
  .tab.active{background:var(--pl-green);color:#000;border-color:var(--pl-green)}
  .viewnote{background:rgba(255,255,255,.08);color:#e9d9ee;font-size:11px;padding:8px 12px;
            border-radius:8px;margin:10px 16px 0}

  .squadlist{padding:4px 16px 0}
  .poshead{font-size:10px;text-transform:uppercase;letter-spacing:.7px;color:var(--muted);
           margin:14px 0 4px}
  .prow{display:flex;justify-content:space-between;align-items:center;padding:7px 0;
        border-top:1px solid var(--line);cursor:pointer;background:none;border-left:none;
        border-right:none;border-bottom:none;width:100%;font:inherit;color:inherit;
        text-align:left}
  .prow:first-child{border-top:none}
  .prow .who{font-size:14px;font-weight:600}
  .prow .meta{font-size:11px;color:var(--muted)}

  .pitch{background:repeating-linear-gradient(0deg,var(--pitch-1) 0 34px,var(--pitch-2) 34px 68px);
         padding:16px 8px 22px;position:relative}
  .pitch::before{content:"";position:absolute;left:50%;top:8px;transform:translateX(-50%);
                 width:34%;height:52px;border:2px solid rgba(255,255,255,.35);border-top:none}
  .row{display:flex;justify-content:center;gap:6px;margin:10px 0;flex-wrap:wrap}
  .player{width:88px;background:var(--card);border-radius:8px;overflow:hidden;cursor:pointer;
          box-shadow:0 2px 5px rgba(0,0,0,.28);transition:transform .12s;border:none;padding:0;
          font-family:inherit;text-align:center;display:block}
  .player:hover,.player:focus-visible{transform:translateY(-3px);outline:2px solid var(--pl-cyan)}
  .shirt{height:34px;background:linear-gradient(160deg,var(--pl-purple),#5a1263);position:relative}
  .shirt.gk{background:linear-gradient(160deg,#0b7a3f,#0f9d52)}
  .badge{position:absolute;top:2px;right:3px;background:var(--pl-green);color:#000;font-size:9px;
         font-weight:800;border-radius:3px;padding:0 3px}
  .pname{font-size:11px;font-weight:700;padding:3px 2px 1px;white-space:nowrap;overflow:hidden;
         text-overflow:ellipsis;color:var(--ink)}
  .pmeta{font-size:10px;color:#fff;background:var(--pl-purple);padding:2px 0 3px}
  .flagdot{position:absolute;top:2px;left:3px;width:8px;height:8px;border-radius:50%;background:#dc2626}

  .bench{background:rgba(0,0,0,.22);padding:8px 6px 12px}
  .bench h3{color:#fff;font-size:10px;letter-spacing:1px;text-transform:uppercase;
            text-align:center;margin:2px 0 8px;opacity:.85}

  section{padding:0 16px}
  h2{font-size:12px;text-transform:uppercase;letter-spacing:.7px;color:var(--muted);margin:22px 0 8px}
  .card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px 16px;margin-bottom:10px}
  .tr{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:9px 0;
      border-top:1px solid var(--line)}
  .tr:first-child{border-top:none}
  .tr .who{font-size:14px;font-weight:600}
  .tr .why{font-size:12px;color:var(--muted);margin-top:2px}
  .gain{font-size:14px;font-weight:800;white-space:nowrap}
  .up{color:#0b8a45}.down{color:#b91c1c}
  .pill{display:inline-block;font-size:10px;font-weight:700;text-transform:uppercase;
        border-radius:999px;padding:2px 8px;margin-right:5px}
  .high{background:#fee2e2;color:#b91c1c}.medium{background:#fef3c7;color:#b45309}
  .low{background:#dbeafe;color:#1d4ed8}
  .muted{color:var(--muted);font-size:12px}

  dialog{border:none;border-radius:14px;padding:0;max-width:460px;width:92%;background:var(--card);
         color:var(--ink)}
  dialog::backdrop{background:rgba(0,0,0,.55)}
  .dhead{background:var(--pl-purple);color:#fff;padding:14px 16px}
  .dbody{padding:6px 16px 16px;max-height:62vh;overflow:auto}
  .close{position:absolute;top:10px;right:12px;background:none;border:none;color:#fff;font-size:20px;
         cursor:pointer;line-height:1}
  textarea{width:100%;border:1px solid var(--line);border-radius:8px;padding:10px;font-family:inherit;
           font-size:14px;background:var(--bg);color:var(--ink);resize:vertical}
  button.action{background:var(--pl-purple);color:#fff;border:none;border-radius:8px;padding:10px 16px;
                font-weight:700;cursor:pointer;font-size:14px}
  button.action:disabled{opacity:.5;cursor:default}
  input[type=password]{width:100%;padding:9px;border:1px solid var(--line);border-radius:8px;
                       background:var(--bg);color:var(--ink);font-size:13px}
  .answer{white-space:pre-wrap;font-size:14px;line-height:1.5;margin-top:12px;padding-top:12px;
          border-top:1px solid var(--line)}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="title">FPL Agent</div>
    <div class="sub" id="sub">loading…</div>
    <div class="stats" id="stats"></div>
    <div class="tabs">
      <button class="tab" id="tabMine" type="button">My squad</button>
      <button class="tab" id="tabOptimal" type="button">Model's optimal XI</button>
    </div>
  </header>

  <div class="viewnote" id="viewNote" style="display:none"></div>

  <div class="squadlist" id="squadList" style="display:none"></div>

  <div class="pitch" id="pitch" style="display:none"></div>
  <div class="bench" id="benchWrap" style="display:none">
    <h3>Substitutes</h3><div class="row" id="benchRow"></div>
  </div>

  <section>
    <h2>Recommended transfers</h2>
    <div class="card" id="transfers"></div>

    <h2>News the numbers can't see</h2>
    <div class="card" id="news"></div>

    <h2>Template gap</h2>
    <div class="card" id="gap"></div>

    <div class="muted" id="stamp" style="margin-top:18px"></div>
  </section>
</div>

<dialog id="dlg">
  <div class="dhead">
    <button class="close" id="closeDlg" aria-label="Close">&times;</button>
    <div id="dTitle" style="font-size:16px;font-weight:800"></div>
    <div id="dMeta" style="font-size:12px;color:#c9b7d4;margin-top:3px"></div>
  </div>
  <div class="dbody" id="dBody"></div>
</dialog>

<script>
const DATA_URL = "data/dashboard.json";
let DATA = null;

const esc = s => String(s ?? "").replace(/[&<>"']/g, c =>
  ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));

// Escaping is not enough for an href. "javascript:alert(1)" contains no
// character that esc() touches, so it survives untouched and becomes script
// execution on click. News source links originate from RSS feeds, one of
// which anyone can post to, so only http(s) is ever allowed to become a
// link. This page now holds no credential of any kind, which caps what such
// a bug could achieve -- but a hostile link on a page you trust is still
// worth preventing on its own account.
const safeUrl = u => {
  const s = String(u ?? "").trim();
  return /^https?:\/\//i.test(s) ? esc(s) : "";
};

function shirt(p, roleKey){
  const gk = p.position === "GKP" ? " gk" : "";
  const cap = p[roleKey] === "captain" ? '<span class="badge">C</span>'
            : p[roleKey] === "vice_captain" ? '<span class="badge">V</span>' : "";
  const flagged = (DATA.news || []).some(n => n.player === p.name);
  const dot = flagged ? '<span class="flagdot" title="news flag"></span>' : "";
  return `<button class="player" data-pid="${esc(p.id)}">
    <div class="shirt${gk}">${cap}${dot}</div>
    <div class="pname">${esc(p.name)}</div>
    <div class="pmeta">${esc(p.team)} · ${p.xp.toFixed(1)}</div>
  </button>`;
}

const POS_LABEL = {GKP:"Goalkeepers", DEF:"Defenders", MID:"Midfielders", FWD:"Forwards"};

function renderPitch(orderKey, benchKey){
  document.getElementById("squadList").style.display = "none";
  document.getElementById("pitch").style.display = "";
  document.getElementById("benchWrap").style.display = "";
  const starters = DATA.squad.filter(p => p[orderKey] !== "bench");
  const byPos = pos => starters.filter(p => p.position === pos);
  document.getElementById("pitch").innerHTML = ["GKP","DEF","MID","FWD"]
    .map(pos => `<div class="row">${byPos(pos).map(p => shirt(p, orderKey)).join("")}</div>`).join("");
  document.getElementById("benchRow").innerHTML = DATA.squad
    .filter(p => p[orderKey] === "bench")
    .sort((a,b) => (a[benchKey] ?? 9) - (b[benchKey] ?? 9))
    .map(p => shirt(p, orderKey)).join("");
}

function renderFlatList(){
  document.getElementById("pitch").style.display = "none";
  document.getElementById("benchWrap").style.display = "none";
  const list = document.getElementById("squadList");
  list.style.display = "";
  list.innerHTML = ["GKP","DEF","MID","FWD"].map(pos => {
    const rows = DATA.squad.filter(p => p.position === pos).map(p => `
      <button class="prow" data-pid="${esc(p.id)}">
        <span class="who">${esc(p.name)} <span class="meta">${esc(p.team)}</span></span>
        <span class="meta">£${p.price.toFixed(1)}m · ${p.xp.toFixed(1)} xP</span>
      </button>`).join("");
    return `<div class="poshead">${POS_LABEL[pos]}</div>${rows}`;
  }).join("");
}

let view = "mine";

function render(){
  const d = DATA;
  document.getElementById("sub").textContent =
    `Gameweek ${d.next_event ?? "?"} · projections for GW${d.horizon?.from}–${d.horizon?.to}`;
  document.getElementById("stats").innerHTML = `
    <div class="stat"><b>${d.projected_xi.toFixed(0)}</b><span>projected XI</span></div>
    <div class="stat"><b>£${d.bank.toFixed(1)}m</b><span>bank</span></div>
    <div class="stat"><b>${esc(d.free_transfers)}</b><span>free transfers</span></div>
    <div class="stat"><b>${d.risk.toFixed(2)}</b><span>risk setting</span></div>`;

  document.getElementById("tabMine").classList.toggle("active", view === "mine");
  document.getElementById("tabOptimal").classList.toggle("active", view === "optimal");

  const note = document.getElementById("viewNote");
  if (view === "optimal"){
    note.style.display = "";
    note.textContent = "Model's suggested lineup for maximum projected points — this is a "
      + "recommendation, not necessarily what you've set in the FPL app.";
    renderPitch("role", "bench_order");
  } else if (d.my_lineup_set){
    note.style.display = "none";
    renderPitch("my_role", "my_bench_order");
  } else {
    note.style.display = "";
    note.textContent = "Your captain and bench order aren't recorded yet, so this just lists "
      + "your 15 — nothing here is a guess. See \"Model's optimal XI\" for what the model would "
      + "start, or tell the agent your captain/bench to have this match your team exactly.";
    renderFlatList();
  }

  document.getElementById("transfers").innerHTML = d.transfers.length
    ? d.transfers.slice(0,5).map(t => `
      <div class="tr"><div>
        <div class="who">${esc(t.out.name)} → ${esc(t.in.name)}</div>
        <div class="why">£${t.in.price.toFixed(1)}m · ${t.in.owned.toFixed(0)}% owned ·
          bank after £${t.bank_after.toFixed(1)}m</div>
      </div><div class="gain ${t.gain>0?"up":"down"}">${t.gain>0?"+":""}${t.gain.toFixed(1)}</div></div>`).join("")
    : '<div class="muted">No transfer beats rolling it this week.</div>';

  document.getElementById("news").innerHTML = (d.news || []).length
    ? d.news.map(n => `<div class="tr"><div>
        <div class="who"><span class="pill ${esc(n.severity)}">${esc(n.severity)}</span>${esc(n.player)}</div>
        <div class="why">${esc(n.concern)}
          ${safeUrl(n.source) ? `<a href="${safeUrl(n.source)}" target="_blank" rel="noopener noreferrer">source</a>` : ""}</div>
      </div></div>`).join("")
    : '<div class="muted">Nothing flagged on your players.</div>';

  document.getElementById("gap").innerHTML = (d.template_gap || []).length
    ? d.template_gap.map(p => `<div class="tr"><div>
        <div class="who">${esc(p.name)} <span class="muted">${esc(p.team)}</span></div>
        <div class="why">${p.owned.toFixed(0)}% owned · £${p.price.toFixed(1)}m</div>
      </div><div class="gain down">−${p.exposure.toFixed(1)}</div></div>`).join("")
      + `<div class="muted" style="margin-top:8px">Exposure is what you concede to the average
         rival by not owning him.</div>`
    : '<div class="muted">You own the template.</div>';

  document.getElementById("stamp").textContent =
    "Generated " + new Date(d.generated_at).toLocaleString() +
    " · numbers from the model, never from a language model.";
}

// ── player dialog ──────────────────────────────────────────────────
const dlg = document.getElementById("dlg");
document.getElementById("closeDlg").onclick = () => dlg.close();

document.getElementById("tabMine").onclick = () => { view = "mine"; render(); };
document.getElementById("tabOptimal").onclick = () => { view = "optimal"; render(); };

document.addEventListener("click", e => {
  const btn = e.target.closest("[data-pid]");
  if (!btn) return;
  const p = DATA.squad.find(x => String(x.id) === btn.dataset.pid);
  if (!p) return;
  document.getElementById("dTitle").textContent = p.name;
  document.getElementById("dMeta").textContent =
    `${esc(p.team)} · ${esc(p.position)} · £${p.price.toFixed(1)}m · ${p.owned.toFixed(0)}% owned · ` +
    `${p.xp.toFixed(1)} projected`;

  const flags = (DATA.news || []).filter(n => n.player === p.name);
  const alts = p.alternatives || [];
  document.getElementById("dBody").innerHTML = `
    <p class="muted" style="margin:12px 0 4px"><b>Minutes:</b> ${esc(p.minutes_reason)}</p>
    ${p.override ? `<p class="muted"><b>Your note:</b> ${esc(p.override)}</p>` : ""}
    ${p.moved_club ? '<p class="muted">Recently joined a new club — context only, projection unchanged.</p>' : ""}
    ${flags.map(f => `<p class="muted"><span class="pill ${esc(f.severity)}">${esc(f.severity)}</span>${esc(f.concern)}</p>`).join("")}
    <h2 style="margin-top:16px">Swap him for</h2>
    ${alts.length ? alts.map(a => `
      <div class="tr"><div>
        <div class="who">${esc(a.name)} <span class="muted">${esc(a.team)}</span></div>
        <div class="why">£${a.price.toFixed(1)}m · ${a.owned.toFixed(0)}% owned ·
          bank after £${a.bank_after.toFixed(1)}m</div>
      </div><div class="gain ${a.gain>0?"up":"down"}">${a.gain>0?"+":""}${a.gain.toFixed(1)}</div></div>`).join("")
      : '<div class="muted">Nothing affordable improves this position.</div>'}
    <p class="muted" style="margin-top:12px">Gain is the change to your projected XI over the
    horizon, respecting your bank, position and the 3-per-club limit.</p>`;
  dlg.showModal();
});

fetch(DATA_URL + "?t=" + Date.now())
  .then(r => { if(!r.ok) throw new Error("HTTP " + r.status); return r.json(); })
  .then(d => { DATA = d; render(); })
  .catch(err => {
    document.getElementById("sub").textContent = "Could not load data: " + err.message;
  });
</script>
</body>
</html>
